global: { scrape_interval: 5s }
scrape_configs:
  - job_name: gateway
    dns_sd_configs: [{ names: [gateway], type: A, port: 8080 }]
  - job_name: worker
    dns_sd_configs: [{ names: [worker, worker-v2], type: A, port: 9100 }]
    relabel_configs:
      # the dashboard groups worker panels by "pod", as on Kubernetes
      - { source_labels: [__address__], target_label: pod }
