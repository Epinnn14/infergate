{{- $s := include "infergate.secret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s }}
  labels: {{- include "infergate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.registry.existingSecret }}
  admin-token: {{ include "infergate.keep" (dict "ctx" . "key" "admin-token" "value" .Values.registry.adminToken "len" 32) | quote }}
  routes-token: {{ include "infergate.keep" (dict "ctx" . "key" "routes-token" "value" .Values.registry.routesToken "len" 32) | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ include "infergate.keep" (dict "ctx" . "key" "redis-password" "value" .Values.redis.password "len" 24) | quote }}
  {{- else if not .Values.redis.external.existingSecret }}
  redis-password: {{ .Values.redis.external.password | quote }}
  {{- end }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ include "infergate.keep" (dict "ctx" . "key" "postgres-password" "value" .Values.postgres.password "len" 24) | quote }}
  {{- else if not .Values.postgres.external.existingSecret }}
  database-url: {{ required "postgres.external.url is required when postgres.enabled=false" .Values.postgres.external.url | quote }}
  {{- end }}
  bootstrap.json: {{ include "infergate.bootstrap" . | quote }}
