{{- if .Values.networkPolicy.enabled }}
{{- $full := include "infergate.fullname" . -}}
{{- range $c := list "redis" "postgres" "registry" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-{{ $c }}
  labels: {{- include "infergate.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "infergate.selector" (dict "ctx" $ "component" $c) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        # every component of this release (gateway, workers, registry)
        - podSelector: { matchLabels: { app.kubernetes.io/instance: {{ $.Release.Name }} } }
        {{- if and (eq $c "redis") $.Values.keda.enabled }}
        # the KEDA operator reads stream lag
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $.Values.networkPolicy.kedaNamespace }} } }
        {{- end }}
{{- end }}
{{- end }}
