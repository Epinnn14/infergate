{{- if .Values.redis.enabled }}
{{- $name := printf "%s-redis" (include "infergate.fullname" .) -}}
{{- $sel := dict "ctx" . "component" "redis" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "infergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "infergate.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "infergate.selector" $sel | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - {{ .Values.redis.maxmemory | quote }}
            # never evict: losing a queued request silently is worse than refusing a new one
            - --maxmemory-policy
            - noeviction
            {{- if .Values.redis.persistence.enabled }}
            - --appendonly
            - "yes"
            {{- else }}
            - --save
            - ""
            {{- end }}
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "infergate.secret" . }}, key: redis-password } }
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }
            periodSeconds: 5
          livenessProbe:   # exec like readiness: NetworkPolicy may drop probes from the node
            exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
      {{- if not .Values.redis.persistence.enabled }}
      volumes:
        - { name: data, emptyDir: {} }
      {{- end }}
  {{- if .Values.redis.persistence.enabled }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.persistence.size }} } }
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "infergate.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  selector: {{- include "infergate.selector" $sel | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis, appProtocol: redis }
{{- end }}
