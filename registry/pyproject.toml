[project]
name = "infergate-registry"
version = "0.1.0"
description = "infergate model registry: models, versions, traffic weights and API keys in PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infergate_registry*"]

[tool.setuptools.package-data]
infergate_registry = ["migrations/*.sql"]
